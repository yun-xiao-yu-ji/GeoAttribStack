name: quick-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quick-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install quick-test dependencies
        run: python -m pip install -r requirements-quick.txt
      - name: Run GeoAttribStack quick test
        run: python examples/quick_test.py
